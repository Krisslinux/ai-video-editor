# Run alongside the hosted ChatGPT Site on a permanent Docker host.
services:
  processor:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["node", "--import", "tsx", "server/worker.ts"]
    env_file: ../.env.processor
    environment:
      NODE_ENV: production
      WORKER_DATA_DIR: /app/data
      FFMPEG_THREADS: "2"
    restart: always
    init: true
    volumes: ["processor-cache:/app/data"]
    read_only: true
    tmpfs: ["/tmp:size=128m"]
    mem_limit: 3g
    cpus: 2.0
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
volumes:
  processor-cache:
